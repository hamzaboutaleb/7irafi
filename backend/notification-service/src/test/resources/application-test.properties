spring.datasource.url=jdbc:h2:mem:notification_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

security.jwt.secret=test-jwt-secret-that-is-long-enough-for-hs256
security.jwt.issuer=7irafi-auth-service

service.security.gateway-shared-secret=test-gateway-key
notifications.cors.allowed-origin=http://localhost:4200

# Explicit test values for settings supplied by Compose in normal runs.
server.port=8086
logging.level.org.hibernate.SQL=info
spring.kafka.bootstrap-servers=kafka:9092
management.metrics.tags.environment=dev
logging.structured.format.console=logstash
logging.structured.json.add.environment=dev
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
