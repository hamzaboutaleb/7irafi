spring.application.name=notification-service
server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
# SQL goes through the logger, so it is JSON with the request id. Set
# SQL_LOG_LEVEL=debug to see it.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notification-service
# Catch up on retained notification requests when this consumer group first starts.
spring.kafka.consumer.auto-offset-reset=earliest

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER}

service.security.gateway-shared-secret=${GATEWAY_SHARED_SECRET}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s

# Structured JSON logs to stdout. Set LOG_FORMAT= (empty) for plain text.
logging.structured.format.console=${LOG_FORMAT}
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENVIRONMENT}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL}

notifications.cors.allowed-origin=${ALLOWED_ORIGIN}
