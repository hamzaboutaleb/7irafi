spring.datasource.url=jdbc:h2:mem:user_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

service.security.gateway-shared-secret=test-gateway-key
service.security.internal-api-key=test-internal-key

# Avatar storage. The clients are built but never contacted in tests: the
# service layer is mocked, so these only have to be present and well-formed.
aws.s3.endpoint=http://localhost:9000
aws.s3.public-endpoint=http://localhost:9000
aws.s3.access-key=test
aws.s3.secret-key=test-secret
aws.s3.region=us-east-1
aws.s3.bucket=avatars-test
users.avatar.max-file-size=2MB
