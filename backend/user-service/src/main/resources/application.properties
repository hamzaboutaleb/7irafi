spring.application.name=user-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

service.security.gateway-shared-secret=${GATEWAY_SHARED_SECRET}
service.security.internal-api-key=${INTERNAL_API_KEY}

management.endpoints.web.exposure.include=health

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
spring.data.web.pageable.max-page-size=20

# How recently a professional must have sent a heartbeat to count as online.
# Not a secret, so a default is fine here.
users.presence.online-threshold=${ONLINE_THRESHOLD:2m}
