spring.application.name=user-service
server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
# SQL goes through the logger, so it is JSON with the request id. Set
# SQL_LOG_LEVEL=debug to see it.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
# users.registered: the name Kafka uses to remember how far user-service has read
spring.kafka.consumer.group-id=user-service-registrations
# first start: read events sent before user-service was up, do not skip them
spring.kafka.consumer.auto-offset-reset=earliest

service.security.gateway-shared-secret=${GATEWAY_SHARED_SECRET}
service.security.internal-api-key=${INTERNAL_API_KEY}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s

# Structured JSON logs to stdout. Set LOG_FORMAT= (empty) for plain text.
logging.structured.format.console=${LOG_FORMAT}
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENVIRONMENT}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL}
spring.data.web.pageable.max-page-size=20

# How recently a professional must have sent a heartbeat to count as online.
# Not a secret, so a default is fine here.
users.presence.online-threshold=${ONLINE_THRESHOLD}

# Avatar storage. The bucket is private: images are served through short-lived
# presigned URLs, never a public link.
aws.s3.endpoint=${S3_ENDPOINT}
aws.s3.public-endpoint=${S3_PUBLIC_ENDPOINT}
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}
aws.s3.region=${S3_REGION}
aws.s3.bucket=${S3_BUCKET}

users.avatar.max-file-size=2MB
spring.servlet.multipart.max-file-size=${users.avatar.max-file-size}
spring.servlet.multipart.max-request-size=4MB
