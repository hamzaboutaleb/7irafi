spring.application.name=user-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

service.security.gateway-shared-secret=${GATEWAY_SHARED_SECRET}
service.security.internal-api-key=${INTERNAL_API_KEY}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:dev}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
spring.data.web.pageable.max-page-size=20

# How recently a professional must have sent a heartbeat to count as online.
# Not a secret, so a default is fine here.
users.presence.online-threshold=${ONLINE_THRESHOLD:2m}

# Avatar storage. The bucket is private: images are served through short-lived
# presigned URLs, never a public link.
aws.s3.endpoint=${S3_ENDPOINT:http://minio:9000}
aws.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
aws.s3.access-key=${S3_ACCESS_KEY:minio}
aws.s3.secret-key=${S3_SECRET_KEY:minio123}
aws.s3.region=${S3_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET:avatars}

users.avatar.max-file-size=2MB
spring.servlet.multipart.max-file-size=${users.avatar.max-file-size}
spring.servlet.multipart.max-request-size=4MB
