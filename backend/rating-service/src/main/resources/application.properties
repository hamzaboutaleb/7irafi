spring.application.name=rating-service
server.port=${SERVER_PORT:8087}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rating_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

# Limit each review-list request to 100 ratings. Spring caps larger size values.
spring.data.web.pageable.max-page-size=100

service.security.gateway-shared-secret=${GATEWAY_SHARED_SECRET}
service.security.internal-api-key=${INTERNAL_API_KEY}

# Shared HTTP settings for calls to the job and user services.
services.http.connect-timeout=${SERVICE_HTTP_CONNECT_TIMEOUT:1s}
services.http.read-timeout=${SERVICE_HTTP_READ_TIMEOUT:2s}

management.endpoints.web.exposure.include=health

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.properties.max.block.ms=5000
