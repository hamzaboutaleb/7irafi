spring.application.name=auth-service
server.port=${SERVER_PORT:8081}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# SQL goes through the logger, so it is JSON with the request id. Set
# SQL_LOG_LEVEL=debug to see it.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:info}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:7irafi-auth-service}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:30m}
# how long a refresh token works before the user must log in again
security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:7d}

# where Kafka runs ("kafka" is the container name in docker-compose)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
# if Kafka is down, give up after 5s (default 60s) so the outbox relay can retry later
spring.kafka.producer.properties.max.block.ms=5000

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:dev}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s

# Structured JSON logs to stdout. Set LOG_FORMAT= (empty) for plain text.
logging.structured.format.console=${LOG_FORMAT:logstash}
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENVIRONMENT:dev}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
