spring.datasource.url=jdbc:h2:mem:auth_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false

security.jwt.secret=7irafi-test-jwt-secret-that-is-at-least-32-bytes
security.jwt.issuer=7irafi-auth-service-test
security.jwt.access-token-ttl=15m
security.jwt.refresh-token-ttl=7d

# no Kafka broker in tests: do not start the outbox relay
outbox.relay.enabled=false

# Explicit test values for settings supplied by Compose in normal runs.
server.port=8081
logging.level.org.hibernate.SQL=info
spring.kafka.bootstrap-servers=kafka:9092
management.metrics.tags.environment=dev
logging.structured.format.console=logstash
logging.structured.json.add.environment=dev
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
