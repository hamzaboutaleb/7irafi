spring.datasource.url=jdbc:h2:mem:job_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# The Flyway migrations use PostgreSQL-only types (TIMESTAMPTZ) that H2
# rejects, so tests let Hibernate create the schema instead.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jobs.outbox.enabled=false

gateway.shared-secret=test-gateway-key
service.security.internal-api-key=test-internal-key

aws.s3.endpoint=http://localhost:9000
aws.s3.public-endpoint=http://localhost:9000
aws.s3.access-key=test
aws.s3.secret-key=test-secret
aws.s3.region=us-east-1
aws.s3.bucket=jobs-test

# Explicit test values for settings supplied by Compose in normal runs.
server.port=8083
spring.kafka.bootstrap-servers=kafka:9092
gateway.cors.allowed-origin=http://localhost:4200
management.metrics.tags.environment=dev
logging.structured.format.console=logstash
logging.structured.json.add.environment=dev
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
