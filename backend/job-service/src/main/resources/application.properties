spring.application.name=job-service

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_db}
spring.datasource.username=${DB_USERNAME:herafi}
spring.datasource.password=${DB_PASSWORD:herafi}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true


gateway.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
gateway.shared-secret=${GATEWAY_SHARED_SECRET:7irafi-development-gateway-key}
service.security.internal-api-key=${INTERNAL_API_KEY:7irafi-development-internal-key}

management.endpoints.web.exposure.include=health

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
aws.s3.endpoint=${S3_ENDPOINT:http://minio:9000}
aws.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
aws.s3.access-key=${S3_ACCESS_KEY:minio}
aws.s3.secret-key=${S3_SECRET_KEY:minio123}
aws.s3.region=${S3_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET:jobs}


jobs.images.max-file-size=10MB
jobs.images.max-count=10
spring.servlet.multipart.max-file-size=${jobs.images.max-file-size}
spring.servlet.multipart.max-request-size=${jobs.images.max-file-size}
