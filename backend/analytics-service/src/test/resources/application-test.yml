server.port: 8087
spring:
  datasource:
    url: ${ANALYTICS_TEST_DB_URL}
    username: ${ANALYTICS_TEST_DB_USERNAME}
    password: ${ANALYTICS_TEST_DB_PASSWORD}
  kafka.bootstrap-servers: localhost:9094
eureka.client.enabled: false
eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka/
gateway.shared-secret: test-gateway-key
security.jwt.secret: analytics-test-jwt-secret-at-least-32-bytes
security.jwt.issuer: analytics-test
analytics.allowed-origin: http://localhost:4200
logging.level.root: WARN
logging.level.org.apache.kafka: ERROR
logging.level.kafka: ERROR
management.metrics.tags.environment: dev
logging.structured.format.console: logstash
logging.structured.json.add.environment: dev
