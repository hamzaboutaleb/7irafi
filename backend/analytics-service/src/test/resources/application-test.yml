spring:
  datasource:
    url: ${ANALYTICS_TEST_DB_URL:jdbc:postgresql://localhost:55439/analytics_test}
    username: ${ANALYTICS_TEST_DB_USERNAME:herafi}
    password: ${ANALYTICS_TEST_DB_PASSWORD:herafi}
  kafka.bootstrap-servers: localhost:9094
eureka.client.enabled: false
