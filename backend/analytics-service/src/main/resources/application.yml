spring:
  application.name: analytics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
    username: ${DB_USERNAME:herafi}
    password: ${DB_PASSWORD:herafi}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: analytics-projections-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
server.port: ${SERVER_PORT:8087}
gateway.shared-secret: ${GATEWAY_SHARED_SECRET:7irafi-development-gateway-key}
security.jwt.secret: ${JWT_SECRET:7irafi-development-jwt-secret-change-me-2026}
security.jwt.issuer: ${JWT_ISSUER:7irafi-auth-service}
analytics.allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
eureka.client.serviceUrl.defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include: health
