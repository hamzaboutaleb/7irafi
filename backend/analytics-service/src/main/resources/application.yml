spring:
  application.name: analytics-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: analytics-projections-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
server.port: ${SERVER_PORT}
# AnalyticsProperties validates the required deployment settings at startup.
gateway.shared-secret: ${GATEWAY_SHARED_SECRET}
security.jwt.secret: ${JWT_SECRET}
security.jwt.issuer: ${JWT_ISSUER}
analytics.allowed-origin: ${FRONTEND_ORIGIN}
eureka.client.serviceUrl.defaultZone: ${DISCOVERY_SERVICE_URL}
management.endpoints.web.exposure.include: health,prometheus
management.metrics.tags.application: ${spring.application.name}
management.metrics.tags.environment: ${APP_ENVIRONMENT}
# Structured JSON logs to stdout. Set LOG_FORMAT= (empty) for plain text.
logging.structured.format.console: ${LOG_FORMAT}
logging.structured.json.add.service: ${spring.application.name}
logging.structured.json.add.environment: ${APP_ENVIRONMENT}
