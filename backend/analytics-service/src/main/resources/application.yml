spring:
  # 1. Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:auth_db} 
    username: ${DB_USERNAME:herafi}                                 
    password: ${DB_PASSWORD:herafi}
  
  # Tell Flyway to use a separate ledger for analytics
  flyway:
    table: flyway_schema_history_analytics
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 2. Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    # ADD THIS PRODUCER BLOCK:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      
    consumer:
      group-id: analytics-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"