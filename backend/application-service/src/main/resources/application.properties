spring.application.name=application-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/application_db}
spring.datasource.username=${DB_USERNAME:herafi}
spring.datasource.password=${DB_PASSWORD:herafi}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

gateway.shared-secret=${GATEWAY_SHARED_SECRET:7irafi-development-gateway-key}
service.security.internal-api-key=${INTERNAL_API_KEY:7irafi-development-internal-key}
services.job.url=${JOB_SERVICE_URL:http://localhost:8083}

management.endpoints.web.exposure.include=health
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
