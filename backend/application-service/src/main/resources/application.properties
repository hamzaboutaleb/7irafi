spring.application.name=application-service
server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=application-service-jobs
# Catch up on retained job lifecycle events when this consumer group first starts.
spring.kafka.consumer.auto-offset-reset=earliest
applications.outbox.enabled=true
applications.outbox.poll-interval-ms=1000
applications.lifecycle.enabled=true

gateway.shared-secret=${GATEWAY_SHARED_SECRET}
service.security.internal-api-key=${INTERNAL_API_KEY}
services.job.url=${JOB_SERVICE_URL}
services.user.url=${USER_SERVICE_URL}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s

# Structured JSON logs to stdout. Set LOG_FORMAT= (empty) for plain text.
logging.structured.format.console=${LOG_FORMAT}
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENVIRONMENT}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL}
