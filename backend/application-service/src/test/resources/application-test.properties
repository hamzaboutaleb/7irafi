spring.datasource.url=jdbc:h2:mem:application_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# The outbox migration uses PostgreSQL JSONB functions; PostgreSQL integration tests validate Flyway.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
applications.outbox.enabled=false
applications.lifecycle.enabled=false

gateway.shared-secret=test-gateway-key
service.security.internal-api-key=test-internal-key

services.job.url=http://localhost:8083
services.user.url=http://localhost:8082
