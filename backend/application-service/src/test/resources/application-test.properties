spring.datasource.url=jdbc:h2:mem:application_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# The outbox migration uses PostgreSQL JSONB functions; PostgreSQL integration tests validate Flyway.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
applications.outbox.enabled=false
applications.lifecycle.enabled=false

gateway.shared-secret=test-gateway-key
service.security.internal-api-key=test-internal-key

services.job.url=http://localhost:8083
services.user.url=http://localhost:8082

# Explicit test values for settings supplied by Compose in normal runs.
server.port=8084
spring.kafka.bootstrap-servers=kafka:9092
management.metrics.tags.environment=dev
logging.structured.format.console=logstash
logging.structured.json.add.environment=dev
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
