spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:7irafi-auth-service}
gateway.shared-secret=${GATEWAY_SHARED_SECRET}
gateway.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:dev}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s

# Structured JSON logs to stdout. Set LOG_FORMAT= (empty) for plain text.
logging.structured.format.console=${LOG_FORMAT:logstash}
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENVIRONMENT:dev}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}
