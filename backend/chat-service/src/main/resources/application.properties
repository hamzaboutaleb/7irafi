spring.application.name=chat-service
server.port=${SERVER_PORT:8085}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:7irafi-auth-service}

service.security.gateway-shared-secret=${GATEWAY_SHARED_SECRET}
service.security.internal-api-key=${INTERNAL_API_KEY}

management.endpoints.web.exposure.include=health

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka/}

chat.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:4200}