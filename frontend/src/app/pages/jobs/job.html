<app-navbar />
<main class="min-h-screen bg-gray-50 px-4 pt-6 pb-10 md:px-6 md:pt-8 md:pb-12">
  <section class="mx-auto max-w-[1120px]" aria-labelledby="jobs-heading">
    <header class="mb-6">
      <h1 id="jobs-heading" class="text-[28px] leading-9 font-semibold text-gray-900">
        {{ 'jobs.findWork' | translate }}
      </h1>
      <p class="mt-1 text-sm leading-6 text-gray-500">{{ 'jobs.subtitle' | translate }}</p>
    </header>

    <app-job-filters [filters]="filters()" (filtersChange)="applyFilters($event)" />

    <app-job-sort [sort]="sort()" (sortChange)="changeSort($event)" />
    <app-job-results
      [jobs]="jobs()"
      [isLoading]="isLoading()"
      [errorMessage]="errorMessage()"
      [hasFilters]="hasFilters()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (jobSelected)="selectedJobId.set($event)"
      (pageChange)="changePage($event)"
      (retryRequested)="loadJobs()"
      (clearFiltersRequested)="clearFilters()"
    />
  </section>
</main>
<app-footer />

@if (selectedJobId(); as jobId) {
  <app-job-details-modal [jobId]="jobId" (closed)="selectedJobId.set(null)" />
}
