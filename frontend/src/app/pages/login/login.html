<div class="min-h-screen grid grid-cols-2">

  <!-- Left: brand side -->
  <div class="bg-gradient-to-br from-primary-600 to-primary-900 flex flex-col items-center justify-center gap-4">
    <img src="logo.svg" alt="7irafy" class="h-14 brightness-0 invert mb-8" />
    <h2 class="text-white text-4xl font-bold text-center max-w-xs leading-snug">Whatever the problem, find someone to fix it</h2>
    <p class="text-primary-100 text-base text-center max-w-xs">Browse thousands of verified professionals or post your request.</p>
  </div>

  <!-- Right: form side -->
  <div class="flex items-center justify-center p-12">
    <div class="w-full max-w-sm">
      <h1 class="text-3xl font-bold text-gray-900">Welcome back</h1>
      <p class="text-gray-500 mt-2">Sign in to your account to continue</p>

      <div class="mt-8">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
        <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary-400" />
      </div>

      <div class="mt-5">
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-sm font-medium text-gray-700">Password</label>
          <a href="#" class="text-xs text-primary-600 hover:text-primary-700">Forgot password?</a>
        </div>
        <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary-400" />
      </div>

      <button class="w-full mt-8 bg-gradient-to-r from-primary-500 to-primary-700 hover:from-primary-600 hover:to-primary-800 text-white text-sm font-medium py-3 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-sm shadow-primary-200 cursor-pointer">
        Sign in
        <svg [lucideIcon]="arrowIcon" class="w-4 h-4" />
      </button>

      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account? <a href="#" class="text-primary-600 font-medium hover:text-primary-700">Sign up</a>
      </p>
    </div>
  </div>

</div>
