<div class="my-4 flex flex-wrap items-end justify-end gap-3">
  <div class="flex min-w-0 items-center gap-2">
    <label for="jobs-sort" class="shrink-0 text-[13px] text-gray-500">
      {{ 'jobs.sortBy' | translate }}
    </label>
    <app-select
      class="block! w-[200px] max-md:w-[180px]"
      controlId="jobs-sort"
      [label]="'jobs.sortBy' | translate"
      [options]="sortOptions()"
      [value]="sort()"
      (valueChange)="sortChange.emit($event)"
    />
  </div>
</div>
