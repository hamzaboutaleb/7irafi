<section class="mb-6 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8"
  aria-labelledby="notifications-heading">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 id="notifications-heading" class="text-xl font-semibold text-gray-900">
      {{ 'notifications.title' | translate }}
      @if (unread()) {
      <span class="ml-2 inline-flex h-6 min-w-6 items-center justify-center rounded-full bg-red-600 px-2 text-xs font-bold text-white">
        {{ unread() }}
      </span>
      }
    </h2>

    @if (unread()) {
    <button type="button" (click)="markAllRead()"
      class="min-h-11 text-sm font-semibold text-primary-700 underline">{{ 'notifications.markAllRead' | translate }}</button>
    }
  </div>

  @if (items().length === 0) {
  <p class="mt-4 text-sm text-gray-500">{{ 'notifications.empty' | translate }}</p>
  } @else {
  <ul class="mt-4 divide-y divide-gray-100">
    @for (notification of items(); track notification.id) {
    <li>
      <button type="button" (click)="activate(notification)"
        class="flex w-full items-start gap-3 rounded-xl px-2 py-3 text-left transition-colors duration-150 hover:bg-gray-50 focus-visible:outline-none focus-visible:bg-gray-50">
        <span aria-hidden="true" class="mt-2 h-2 w-2 shrink-0 rounded-full"
          [class]="notification.read ? 'bg-transparent' : 'bg-red-600'"></span>
        <span class="min-w-0 flex-1">
          <span class="block text-sm font-semibold text-gray-900">{{ notification.title }}</span>
          <span class="mt-0.5 block break-words text-sm text-gray-600">{{ notification.body }}</span>
        </span>
        <time [attr.datetime]="notification.createdAt" class="shrink-0 text-xs text-gray-400">
          {{ notification.createdAt | date: 'MMM d, HH:mm' }}
        </time>
      </button>
    </li>
    }
  </ul>
  }
</section>
