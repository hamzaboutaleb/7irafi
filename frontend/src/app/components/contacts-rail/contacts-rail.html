@if (isAuthenticated && contacts().length > 0) {
  <!-- Hidden below md: a fixed right rail cannot work at phone width. Mobile
       needs its own treatment; see todo.md. -->
  <aside
    class="contacts-rail"
    [class.contacts-rail--expanded]="expanded()"
    aria-label="{{ 'network.title' | translate }}"
  >
    <button
      type="button"
      class="contacts-rail__toggle"
      (click)="toggleExpanded()"
      [attr.aria-expanded]="expanded()"
    >
      <svg class="contacts-rail__toggle-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          [attr.d]="
            expanded()
              ? 'M12.7 5.3a1 1 0 0 1 0 1.4L9.4 10l3.3 3.3a1 1 0 0 1-1.4 1.4l-4-4a1 1 0 0 1 0-1.4l4-4a1 1 0 0 1 1.4 0Z'
              : 'M7.3 14.7a1 1 0 0 1 0-1.4L10.6 10 7.3 6.7a1 1 0 0 1 1.4-1.4l4 4a1 1 0 0 1 0 1.4l-4 4a1 1 0 0 1-1.4 0Z'
          "
        />
      </svg>

      @if (expanded()) {
        <span class="contacts-rail__title">{{ 'network.title' | translate }}</span>
      }

      <span class="sr-only">
        {{ expanded() ? 'Collapse your network' : 'Expand your network' }}
      </span>
    </button>

    <ul class="contacts-rail__list">
      @for (contact of contacts(); track contact.userId) {
        <li>
          <button
            type="button"
            class="contacts-rail__contact"
            (click)="openConversation(contact.userId)"
            [attr.title]="expanded() ? null : contact.firstName"
          >
            <span class="contacts-rail__avatar">
              @if (contact.avatarUrl) {
                <img [src]="contact.avatarUrl" alt="" class="contacts-rail__photo" />
              } @else {
                <span class="contacts-rail__initial" aria-hidden="true">
                  {{ contact.firstName.charAt(0) }}
                </span>
              }

              <span
                class="contacts-rail__status"
                [class.contacts-rail__status--online]="contact.online"
                aria-hidden="true"
              ></span>
            </span>

            @if (expanded()) {
              <span class="contacts-rail__details">
                <span class="contacts-rail__name">{{ contact.firstName }}</span>
                <span class="contacts-rail__service">
                  @if (contact.categories.length > 0) {
                    {{ contact.categories[0].displayName }}
                  } @else {
                    Professional
                  }
                </span>
              </span>
            }

            <span class="sr-only">
              {{ contact.firstName }}, {{ contact.online ? 'online' : 'offline' }}
            </span>
          </button>
        </li>
      }
    </ul>
  </aside>
}
