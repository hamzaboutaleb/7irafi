@if (isAuthenticated && contacts().length > 0) {
  <!-- Hidden below md: a fixed right rail cannot work at phone width. Mobile
       needs its own treatment; see todo.md. -->
  <aside
    class="fixed right-0 top-1/2 z-40 hidden -translate-y-1/2 flex-col rounded-l-2xl border border-r-0 border-gray-200 bg-white/90 py-3 shadow-lg backdrop-blur-sm md:flex"
    [class.w-16]="!expanded()"
    [class.w-64]="expanded()"
    aria-label="Your network"
  >
    <button
      type="button"
      (click)="toggleExpanded()"
      [attr.aria-expanded]="expanded()"
      class="mx-2 mb-2 flex min-h-9 cursor-pointer items-center gap-2 rounded-lg px-2 text-xs font-semibold uppercase tracking-wide text-gray-500 transition-colors hover:bg-gray-50 hover:text-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          [attr.d]="
            expanded()
              ? 'M12.7 5.3a1 1 0 0 1 0 1.4L9.4 10l3.3 3.3a1 1 0 0 1-1.4 1.4l-4-4a1 1 0 0 1 0-1.4l4-4a1 1 0 0 1 1.4 0Z'
              : 'M7.3 14.7a1 1 0 0 1 0-1.4L10.6 10 7.3 6.7a1 1 0 0 1 1.4-1.4l4 4a1 1 0 0 1 0 1.4l-4 4a1 1 0 0 1-1.4 0Z'
          "
        />
      </svg>

      @if (expanded()) {
        <span class="truncate">Your network</span>
      }

      <span class="sr-only">
        {{ expanded() ? 'Collapse your network' : 'Expand your network' }}
      </span>
    </button>

    <ul class="flex max-h-[60vh] flex-col gap-1 overflow-y-auto px-2">
      @for (contact of contacts(); track contact.userId) {
        <li>
          <button
            type="button"
            (click)="openConversation(contact.userId)"
            class="flex w-full cursor-pointer items-center gap-3 rounded-lg p-1 text-left transition-colors hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400"
            [attr.title]="expanded() ? null : contact.firstName"
          >
            <span class="relative shrink-0">
              <span
                class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-100 text-sm font-bold uppercase text-primary-700"
                aria-hidden="true"
              >
                {{ contact.firstName.charAt(0) }}
              </span>

              <span
                class="absolute bottom-0 right-0 block h-3 w-3 rounded-full border-2 border-white"
                [class.bg-green-500]="contact.online"
                [class.bg-gray-300]="!contact.online"
                aria-hidden="true"
              ></span>
            </span>

            @if (expanded()) {
              <span class="min-w-0 flex-1">
                <span class="block truncate text-sm font-medium capitalize text-gray-900">
                  {{ contact.firstName }}
                </span>
                <span class="block truncate text-xs text-gray-500">
                  @if (contact.categories.length > 0) {
                    {{ contact.categories[0].displayName }}
                  } @else {
                    Professional
                  }
                </span>
              </span>
            }

            <span class="sr-only">
              {{ contact.firstName }}, {{ contact.online ? 'online' : 'offline' }}
            </span>
          </button>
        </li>
      }
    </ul>
  </aside>
}
