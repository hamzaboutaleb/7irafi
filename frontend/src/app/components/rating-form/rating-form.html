<form [formGroup]="form" (ngSubmit)="onSubmit()" class="rating-form">
  <div class="form-group">
    <label class="form-label">Your Rating</label>
    <div class="star-rating" role="radiogroup" aria-label="Select rating" (mouseleave)="onStarLeave()">
      @for (star of stars; track star) {
        <button
          type="button"
          class="star-btn"
          [class.filled]="star <= (hoverScore || form.value.score || 0)"
          [class.hover]="hoverScore > 0 && star <= hoverScore && star > (form.value.score || 0)"
          (click)="selectScore(star)"
          (mouseenter)="onStarHover(star)"
          [attr.aria-label]="'Rate ' + star + ' out of 5'"
          [attr.aria-checked]="star === form.value.score">
          <lucide-icon [img]="Star" class="star-icon"></lucide-icon>
        </button>
      }
    </div>
    @if (form.value.score > 0) {
      <div class="score-text">{{ form.value.score }} out of 5</div>
    }
  </div>

  <div class="form-group">
    <label for="comment" class="form-label">Comment (optional)</label>
    <textarea
      id="comment"
      formControlName="comment"
      placeholder="Share your experience..."
      rows="3"
      class="form-textarea"></textarea>
    @if (form.get('comment')?.invalid && form.get('comment')?.touched) {
      <small class="error">Comment must be 1000 characters or less</small>
    }
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Submitting...' : 'Submit Rating' }}
    </button>
  </div>
</form>
