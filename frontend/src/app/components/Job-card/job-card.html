<article class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
  <button
    type="button"
    (click)="viewDetails.emit()"
    [attr.aria-label]="'View details for ' + job().title"
    aria-haspopup="dialog"
    class="mb-4 block w-full cursor-pointer rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 focus-visible:ring-offset-2"
  >
    <img
      [src]="imageUrl()"
      [alt]="imageUrl() === placeholderUrl ? 'Job image placeholder' : job().title"
      (error)="onImageError()"
      loading="lazy"
      class="h-60 w-full rounded-xl object-cover"
    />
  </button>

  <div class="flex items-start justify-between gap-3">
    <h2 class="text-lg font-semibold text-gray-900">
      <button
        type="button"
        (click)="viewDetails.emit()"
        aria-haspopup="dialog"
        class="cursor-pointer rounded text-left hover:text-primary-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 focus-visible:ring-offset-2"
      >
        {{ job().title }}
      </button>
    </h2>
    <span class="shrink-0 rounded-full bg-primary-50 px-3 py-1 text-xs font-semibold text-primary-700">
      {{ job().status | titlecase }}
    </span>
  </div>

  <dl class="mt-5 grid grid-cols-2 gap-3 text-sm">
    <div>
      <dt class="text-gray-500">Skill</dt>
      <dd class="mt-1 font-semibold text-gray-900">{{ job().skill }}</dd>
    </div>

    <div>
      <dt class="text-gray-500">City</dt>
      <dd class="mt-1 font-semibold text-gray-900">{{ job().city }}</dd>
    </div>

    <div>
      <dt class="text-gray-500">Budget</dt>
      <dd class="mt-1 font-semibold text-gray-900">
        {{ job().budget | number: '1.0-2' }} MAD
      </dd>
    </div>

    <div>
      <dt class="text-gray-500">Posted</dt>
      <dd class="mt-1 font-semibold text-gray-900">
        {{ job().createdAt | date: 'mediumDate' }}
      </dd>
    </div>
  </dl>
</article>
