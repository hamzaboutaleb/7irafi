<article class="relative flex h-[480px] w-full min-w-0 flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
  <button type="button" (click)="viewDetails.emit()" aria-haspopup="dialog"
    [attr.aria-label]="'View details for ' + job().title"
    class="absolute inset-0 z-10 cursor-pointer rounded-2xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-400"></button>
  <img [src]="imageUrl()" [alt]="imageUrl() === placeholderUrl ? 'Job image placeholder' : job().title"
    (error)="onImageError()" loading="lazy" class="mb-4 h-60 w-full shrink-0 rounded-xl object-cover" />

  <div class="flex items-start justify-between gap-3">
    <h2 class="h-14 min-w-0 flex-1 overflow-hidden text-lg font-semibold leading-7 text-gray-900">
      <span class="line-clamp-2 [overflow-wrap:anywhere]">{{ job().title }}</span>
    </h2>
    <span class="shrink-0 rounded-full bg-primary-50 px-3 py-1 text-xs font-semibold text-primary-700">
      {{ job().status | titlecase }}
    </span>
  </div>

  <dl class="mt-5 grid grid-cols-2 gap-3 text-sm">
    <div class="min-w-0">
      <dt class="text-gray-500">Skill</dt>
      <dd class="mt-1 truncate font-semibold text-gray-900">{{ job().skill }}</dd>
    </div>

    <div class="min-w-0">
      <dt class="text-gray-500">City</dt>
      <dd class="mt-1 truncate font-semibold text-gray-900">{{ job().city }}</dd>
    </div>

    <div class="min-w-0">
      <dt class="text-gray-500">Budget</dt>
      <dd class="mt-1 truncate font-semibold text-gray-900">
        {{ job().budget | number: '1.0-2' }} MAD
      </dd>
    </div>

    <div class="min-w-0">
      <dt class="text-gray-500">Posted</dt>
      <dd class="mt-1 truncate font-semibold text-gray-900">
        {{ job().createdAt | date: 'mediumDate' }}
      </dd>
    </div>
  </dl>
</article>
