<article class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
  @if (images().length > 0) {
    <img
      [src]="images()[0].url"
      [alt]="job().title"
      class="mb-4 h-40 w-full rounded-xl object-cover"
    />
  } @else {
    <div class="mb-4 flex h-40 w-full items-center justify-center rounded-xl bg-gray-100">
      <span class="text-sm font-medium text-gray-500">No image</span>
    </div>
  }

  <div class="flex items-start justify-between gap-3">
    <h2 class="text-lg font-semibold text-gray-900">{{ job().title }}</h2>
    <span class="shrink-0 rounded-full bg-primary-50 px-3 py-1 text-xs font-semibold text-primary-700">
      {{ job().status }}
    </span>
  </div>

  <p class="mt-3 line-clamp-3 text-sm leading-6 text-gray-600">
    {{ job().description }}
  </p>

  <dl class="mt-5 grid grid-cols-2 gap-3 text-sm">
    <div>
      <dt class="text-gray-500">Skill</dt>
      <dd class="mt-1 font-semibold text-gray-900">{{ job().skill }}</dd>
    </div>

    <div>
      <dt class="text-gray-500">City</dt>
      <dd class="mt-1 font-semibold text-gray-900">{{ job().city }}</dd>
    </div>

    <div>
      <dt class="text-gray-500">Budget</dt>
      <dd class="mt-1 font-semibold text-gray-900">
        {{ job().budget | currency: 'MAD' : 'symbol' : '1.0-0' }}
      </dd>
    </div>

    <div>
      <dt class="text-gray-500">Posted</dt>
      <dd class="mt-1 font-semibold text-gray-900">
        {{ job().createdAt | date: 'mediumDate' }}
      </dd>
    </div>
  </dl>
</article>
