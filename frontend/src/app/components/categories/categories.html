<section class="categories" aria-labelledby="landing-services-title">
  <div class="categories__container">
    <header class="categories__header"><div><h2 id="landing-services-title" class="categories__title">{{ 'landing.servicesTitle' | translate }}</h2><p class="categories__description">{{ 'landing.servicesBody' | translate }}</p></div><a routerLink="/professionals" class="categories__browse-link">{{ 'directory.allServices' | translate }}<svg [lucideIcon]="arrow" class="categories__arrow" aria-hidden="true" /></a></header>
    <ul class="categories__grid">
      @for (category of categories; track category.code) {
        <li><a routerLink="/professionals" [queryParams]="{category: category.code}" class="categories__category"><svg [lucideIcon]="category.icon" class="categories__icon" aria-hidden="true" /><span>{{ category.label | translate }}</span><svg [lucideIcon]="arrow" class="categories__category-arrow" aria-hidden="true" /></a></li>
      }
    </ul>
  </div>
</section>
