<section class="py-20 bg-gray-50">
  <div class="max-w-7xl mx-auto px-8">
    <div class="flex flex-col items-center mb-12">
      <span class="bg-primary-50 text-primary-600 text-sm font-medium px-4 py-1 rounded-full mb-4"
        >Our Services</span
      >
      <h2 class="text-4xl font-bold text-gray-900 text-center">Browse by service</h2>
      <p class="mt-3 text-sm text-gray-500 text-center max-w-xl">
        Find the right professional for any job — from plumbing to carpentry and beyond.
      </p>
    </div>

    <div class="grid grid-cols-6 gap-4">
      @for (category of categories(); track category.name) {
        <div
          class="flex flex-col items-center p-4 bg-white rounded-2xl border border-gray-100 hover:border-primary-400 hover:shadow-md hover:-translate-y-1 transition-all duration-200 cursor-pointer group"
        >
          <div
            class="w-12 h-12 rounded-xl bg-primary-50 group-hover:bg-primary-100 flex items-center justify-center mb-3 transition-colors duration-200"
          >
            <svg [lucideIcon]="getIcon(category.name)" class="w-5 h-5 text-primary-500" />
          </div>
          <span class="text-xs font-semibold text-gray-600 text-center">{{ category.name }}</span>
        </div>
      }
    </div>

    <div class="flex justify-end mt-8">
      <a
        href="#"
        class="text-sm font-medium text-primary-500 hover:text-primary-700 flex items-center gap-1"
      >
        View all services →
      </a>
    </div>
  </div>
</section>
