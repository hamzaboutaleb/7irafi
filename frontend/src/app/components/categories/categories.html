<section class="services-section" aria-labelledby="landing-services-title">
  <div class="services-inner"><header><div><h2 id="landing-services-title">{{ 'landing.servicesTitle' | translate }}</h2><p>{{ 'landing.servicesBody' | translate }}</p></div><a routerLink="/professionals" class="all-services">{{ 'directory.allServices' | translate }}<svg [lucideIcon]="arrow" class="directional" aria-hidden="true" /></a></header>
    <ul class="services-grid">@for (category of categories; track category.code) { <li><a routerLink="/professionals" [queryParams]="{category: category.code}"><svg [lucideIcon]="category.icon" aria-hidden="true" /><span>{{ category.label | translate }}</span><svg [lucideIcon]="arrow" class="service-arrow directional" aria-hidden="true" /></a></li> }</ul>
  </div>
</section>
