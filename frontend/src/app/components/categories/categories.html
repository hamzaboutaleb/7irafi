<section class="py-16">
  <div class="max-w-7xl mx-auto px-8">
    <h2 class="text-3xl font-bold text-gray-900 text-center mb-10">Browse by category</h2>
    <div class="grid grid-cols-6 gap-4">
      @for (category of categories(); track category.name) {
        <div class="flex flex-col items-center p-4 bg-white rounded-xl shadow-sm hover:shadow-md cursor-pointer">
          <svg [lucideIcon]="getIcon(category.name)" class="w-8 h-8 text-blue-600 mb-3" />
          <span class="font-medium text-gray-700">{{ category.name }}</span>
        </div>
      }
    </div>
  </div>
</section>
