<dialog #dialog (close)="closed.emit()" (cancel)="busy() && $event.preventDefault()"
  aria-labelledby="posting-status-title" aria-describedby="posting-status-message"
  class="fixed inset-0 m-auto max-h-[80dvh] w-[calc(100%-2rem)] max-w-sm overflow-y-auto rounded-2xl border-0 bg-white p-6 text-gray-900 shadow-xl backdrop:bg-gray-900/50">
  <h2 id="posting-status-title" class="text-lg font-semibold">{{ heading() }}</h2>
  <p id="posting-status-message" role="status" class="mt-3 text-sm leading-6 text-gray-600">{{ message() }}</p>
  @for (error of errors(); track $index) {
    <p class="mt-2 break-words text-sm text-red-700">{{ error }}</p>
  }
  <div class="mt-5 flex flex-wrap justify-end gap-3">
    @if (canRetry()) {
      <button type="button" (click)="retry.emit()" [disabled]="busy()"
        class="cursor-pointer rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 disabled:opacity-50">
        {{ busy() ? 'Uploading…' : 'Retry photos' }}
      </button>
    }
    <button type="button" autofocus (click)="dialog.close()" [disabled]="busy()"
      class="cursor-pointer rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-semibold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400 disabled:opacity-50">{{ 'common.close' | translate }}</button>
  </div>
</dialog>
