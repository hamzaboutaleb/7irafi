<dialog
  #dialog
  (close)="closed.emit()"
  aria-labelledby="posting-status-title"
  aria-describedby="posting-status-message"
  class="posting-status-modal"
>
  <h2 id="posting-status-title" class="posting-status-modal__title">{{ heading() }}</h2>
  <p id="posting-status-message" role="status" class="posting-status-modal__message">
    {{ message() }}
  </p>
  @for (error of errors(); track $index) {
    <p class="posting-status-modal__error">{{ error }}</p>
  }
  <div class="posting-status-modal__actions">
    <button type="button" autofocus (click)="dialog.close()" class="posting-status-modal__close">
      {{ 'common.close' | translate }}
    </button>
  </div>
</dialog>
