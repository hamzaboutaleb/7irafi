<span class="rating-stars" role="img" [attr.aria-label]="ratingLabel()">
  @for (starNumber of starNumbers; track starNumber) {
    <span class="rating-stars__star" aria-hidden="true">
      <svg class="rating-stars__outline" lucideStar></svg>
      <span class="rating-stars__fill" [style.width.%]="starFillPercentage(starNumber)">
        <svg class="rating-stars__filled-icon" lucideStar></svg>
      </span>
    </span>
  }
</span>
