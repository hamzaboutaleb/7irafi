<label class="sr-only" for="language">{{ 'nav.language' | translate }}</label>
<select id="language" [value]="current()" (change)="change($event)"
  class="cursor-pointer rounded-lg border border-gray-200 bg-white px-2 py-2 text-sm font-medium text-gray-600 transition-colors duration-200 hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
  @for (option of options; track option.code) {
  <option [value]="option.code">{{ option.label }}</option>
  }
</select>
