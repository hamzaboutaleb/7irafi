<div class="relative">
  <button type="button" (click)="toggle()" [attr.aria-expanded]="open()" aria-haspopup="true"
    [attr.aria-label]="unread() ? unread() + ' unread notifications' : 'Notifications'"
    class="relative rounded-lg px-3 py-2 text-sm font-medium text-gray-600 transition-colors duration-200 hover:bg-gray-50 hover:text-primary-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-400">
    <span aria-hidden="true" class="text-lg leading-none">🔔</span>
    @if (unread()) {
    <span
      class="absolute -right-0.5 -top-0.5 flex h-5 min-w-5 items-center justify-center rounded-full bg-red-600 px-1 text-[11px] font-bold text-white">
      {{ unread() > 9 ? '9+' : unread() }}
    </span>
    }
  </button>

  @if (open()) {
  <div role="menu"
    class="absolute right-0 z-50 mt-2 w-80 max-w-[calc(100vw-2rem)] overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-lg">
    <div class="flex items-center justify-between border-b border-gray-100 px-4 py-3">
      <h2 class="text-sm font-semibold text-gray-900">Notifications</h2>
      @if (unread()) {
      <button type="button" (click)="markAllRead()"
        class="text-xs font-semibold text-primary-700 underline">Mark all read</button>
      }
    </div>

    @if (items().length === 0) {
    <p class="px-4 py-6 text-center text-sm text-gray-500">Nothing yet.</p>
    } @else {
    <ul class="max-h-96 divide-y divide-gray-100 overflow-y-auto">
      @for (notification of items(); track notification.id) {
      <li>
        <button type="button" (click)="activate(notification)"
          class="flex w-full gap-3 px-4 py-3 text-left transition-colors duration-150 hover:bg-gray-50 focus-visible:outline-none focus-visible:bg-gray-50"
          [class.bg-primary-50/60]="!notification.read">
          <span aria-hidden="true" class="mt-1.5 h-2 w-2 shrink-0 rounded-full"
            [class]="notification.read ? 'bg-transparent' : 'bg-primary-600'"></span>
          <span class="min-w-0">
            <span class="block truncate text-sm font-semibold text-gray-900">{{ notification.title }}</span>
            <span class="mt-0.5 block line-clamp-2 text-sm text-gray-600">{{ notification.body }}</span>
          </span>
        </button>
      </li>
      }
    </ul>
    }
  </div>
  }
</div>
