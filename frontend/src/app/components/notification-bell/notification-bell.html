<button
  #trigger
  type="button"
  class="notification-bell__trigger"
  [class.notification-bell__trigger--open]="open()"
  (click)="toggle()"
>
  <svg class="notification-bell__icon" lucideBell></svg>
  @if (unread()) {
    <span class="notification-bell__badge" dir="ltr">{{ unread() > 99 ? '99+' : unread() }}</span>
    <span class="notification-bell__count" [id]="controlId() + '-count'">{{
      'nav.unread' | translate: { count: unread() }
    }}</span>
  }
</button>
<div
  #panel
  [id]="controlId()"
  popover="manual"
  role="region"
  tabindex="-1"
  class="notification-bell__popover"
>
  <app-notification-panel
    [compact]="true"
    [headingId]="controlId() + '-heading'"
    (activated)="close(true)"
    (dismissRequested)="close(true)"
  />
</div>
