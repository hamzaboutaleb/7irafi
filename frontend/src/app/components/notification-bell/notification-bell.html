<button #trigger type="button" class="notification-bell relative grid size-11 cursor-pointer place-items-center rounded-lg border border-transparent text-gray-600 transition-colors duration-[160ms] hover:bg-gray-100 aria-expanded:bg-primary-50 aria-expanded:text-primary-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-700 motion-reduce:transition-none" (click)="toggle()"
  [attr.aria-label]="'notifications.title' | translate" [attr.aria-expanded]="open()"
  [attr.aria-controls]="controlId()" [attr.aria-describedby]="unread() ? controlId() + '-count' : null">
  <svg class="size-[18px] stroke-[1.5]" lucideBell aria-hidden="true"></svg>
  @if (unread()) {
    <span class="notification-badge absolute -end-0.5 top-0 grid h-[18px] min-w-[18px] place-items-center rounded-xl border-2 border-white bg-red-700 px-1 text-[10px] leading-[14px] font-semibold text-white tabular-nums" dir="ltr" aria-hidden="true">{{ unread() > 99 ? '99+' : unread() }}</span>
    <span class="sr-only" [id]="controlId() + '-count'">{{ 'nav.unread' | translate: { count: unread() } }}</span>
  }
</button>
<div #panel [id]="controlId()" popover="manual" role="region" tabindex="-1"
  class="notification-popover fixed inset-auto m-0 max-h-[calc(100dvh_-_96px)] overflow-y-auto overscroll-contain rounded-xl border border-gray-200 bg-white text-gray-700 shadow-[0_8px_24px_rgb(0_0_0_/_8%)] focus:outline-none" [attr.aria-labelledby]="controlId() + '-heading'">
  <app-notification-panel [compact]="true" [headingId]="controlId() + '-heading'"
    (activated)="close(true)" (dismissRequested)="close(true)" />
</div>
