<section class="hero" aria-labelledby="landing-title">
  <div class="hero-inner">
    <div class="hero-copy">
      <h1 id="landing-title">{{ 'landing.headline' | translate }}</h1>
      <p>{{ 'landing.description' | translate }}</p>
      <div class="hero-actions"><a routerLink="/jobs/new" class="primary-link">{{ 'myJobs.post' | translate }}<svg [lucideIcon]="icons.arrow" class="directional" aria-hidden="true" /></a><a routerLink="/professionals" class="secondary-link">{{ 'landing.browseProfessionals' | translate }}</a></div>
      <p class="hero-note">{{ 'landing.heroNote' | translate }}</p>
    </div>
    <figure class="product-preview">
      <figcaption>{{ 'landing.exampleLabel' | translate }}</figcaption>
      <div class="preview-job"><div class="preview-top"><span>{{ 'jobDetails.overview' | translate }}</span><span class="job-status">{{ 'dashboard.status.OPEN' | translate }}</span></div><h2>{{ 'landing.exampleTitle' | translate }}</h2><p class="preview-location"><svg [lucideIcon]="icons.service" aria-hidden="true" />{{ 'categories.plumbing' | translate }}<span aria-hidden="true">·</span><svg [lucideIcon]="icons.city" aria-hidden="true" />{{ 'landing.exampleCity' | translate }}</p><p class="preview-description">{{ 'landing.exampleDescription' | translate }}</p><div class="preview-budget"><div><span>{{ 'job.budget' | translate }}</span><strong><bdi>{{ budget() }} <span>MAD</span></bdi></strong></div><span>{{ 'createJob.halfDay' | translate }}</span></div></div>
      <div class="preview-applicants"><h3>{{ 'landing.compareApplicants' | translate }}</h3><div class="example-person"><span class="avatar" aria-hidden="true">AB</span><div><p>Amine Bennani</p><span>{{ 'categories.plumbing' | translate }}</span></div><span class="pending">{{ 'applications.status.PENDING' | translate }}</span></div><div class="example-person"><span class="avatar" aria-hidden="true">YR</span><div><p>Youssef Rachidi</p><span>{{ 'categories.plumbing' | translate }}</span></div><span class="pending">{{ 'applications.status.PENDING' | translate }}</span></div></div>
    </figure>
  </div>
</section>
