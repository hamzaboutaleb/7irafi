<section class="hero" aria-labelledby="landing-title">
  <div class="hero__container">
    <div>
      <h1 id="landing-title" class="hero__title">{{ 'landing.headline' | translate }}</h1>
      <p class="hero__description">{{ 'landing.description' | translate }}</p>
      <div class="hero__actions">
        <a routerLink="/jobs/new" class="hero__primary-action">{{ 'myJobs.post' | translate }}<svg [lucideIcon]="icons.arrow" class="hero__arrow" aria-hidden="true" /></a>
        <a routerLink="/professionals" class="hero__secondary-action">{{ 'landing.browseProfessionals' | translate }}</a>
      </div>
      <p class="hero__note">{{ 'landing.heroNote' | translate }}</p>
    </div>
    <figure class="hero__preview">
      <figcaption class="hero__preview-caption">{{ 'landing.exampleLabel' | translate }}</figcaption>
      <div class="hero__preview-body">
        <div class="hero__preview-meta"><span>{{ 'jobDetails.overview' | translate }}</span><span class="hero__status">{{ 'dashboard.status.OPEN' | translate }}</span></div>
        <h2 class="hero__preview-title">{{ 'landing.exampleTitle' | translate }}</h2>
        <p class="hero__metadata"><svg [lucideIcon]="icons.service" class="hero__metadata-icon" aria-hidden="true" />{{ 'categories.plumbing' | translate }}<span aria-hidden="true">·</span><svg [lucideIcon]="icons.city" class="hero__metadata-icon" aria-hidden="true" />{{ 'landing.exampleCity' | translate }}</p>
        <p class="hero__preview-description">{{ 'landing.exampleDescription' | translate }}</p>
        <div class="hero__budget-row"><div><span>{{ 'job.budget' | translate }}</span><strong class="hero__budget"><bdi>{{ budget() }} <span class="hero__currency">MAD</span></bdi></strong></div><span>{{ 'createJob.halfDay' | translate }}</span></div>
      </div>
      <div class="hero__applicants">
        <h3 class="hero__applicants-title">{{ 'landing.compareApplicants' | translate }}</h3>
        <div class="hero__applicant"><span class="hero__avatar" aria-hidden="true">AB</span><div class="hero__identity"><p class="hero__name">Amine Bennani</p><span class="hero__detail">{{ 'categories.plumbing' | translate }}</span></div><span class="hero__detail">{{ 'applications.status.PENDING' | translate }}</span></div>
        <div class="hero__applicant hero__applicant--separated"><span class="hero__avatar" aria-hidden="true">OB</span><div class="hero__identity"><p class="hero__name">Othman Benjelloun</p><span class="hero__detail">{{ 'categories.plumbing' | translate }}</span></div><span class="hero__detail">{{ 'applications.status.PENDING' | translate }}</span></div>
      </div>
    </figure>
  </div>
</section>
