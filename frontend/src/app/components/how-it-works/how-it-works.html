<section class="py-16 bg-white">
  <div class="max-w-7xl mx-auto px-8">
    <div class="flex flex-col items-center mb-12">
      <span class=" bg-primary-50 text-primary-600 text-sm font-medium px-4 py-1 rounded-full mb-4"
        >How it works</span
      >
      <h2 class="text-4xl font-bold text-gray-900 text-center">Simple steps to get help</h2>
      <p class="mt-3 text-sm text-gray-500 text-center max-w-xl">
        From posting your problem to getting it fixed â it takes just a few minutes.
      </p>
    </div>
    <div class="grid grid-cols-3 gap-8 relative">
      <div class="absolute top-6 left-[16%] right-[16%] border-t-2 border-dashed border-primary-200 z-0"></div>
      @for (step of steps(); track step.number) {
        <div class="flex flex-col items-center text-center">
          <div
            class="w-12 h-12 rounded-full bg-primary-500 text-white flex items-center justify-center text-xl font-bold mb-4 z-10 relative"
          >
            {{ step.number }}
          </div>
          <h3 class="text-xl font-semibold text-gray-900 mb-2">{{ step.title }}</h3>
          <p class="text-gray-500">{{ step.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
