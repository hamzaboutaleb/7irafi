<section class="hiring-steps" aria-labelledby="hiring-steps-title">
  <div class="hiring-steps__container">
    <header class="hiring-steps__header"><h2 id="hiring-steps-title" class="hiring-steps__title">{{ 'landing.howTitle' | translate }}</h2><p class="hiring-steps__description">{{ 'landing.howBody' | translate }}</p></header>
    <ol class="hiring-steps__list">
      @for (step of steps; track step.number) {
        <li class="hiring-steps__step"><span class="hiring-steps__number" aria-hidden="true">{{ step.number }}</span><h3 class="hiring-steps__step-title">{{ step.title | translate }}</h3><p class="hiring-steps__description">{{ step.body | translate }}</p></li>
      }
    </ol>
  </div>
</section>
