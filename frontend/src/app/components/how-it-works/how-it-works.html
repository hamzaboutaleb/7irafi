<section class="how-section" aria-labelledby="hiring-steps-title"><div class="how-inner"><header><h2 id="hiring-steps-title">{{ 'landing.howTitle' | translate }}</h2><p>{{ 'landing.howBody' | translate }}</p></header><ol class="steps">@for (step of steps; track step.number) { <li><span class="step-number" aria-hidden="true">{{ step.number }}</span><h3>{{ step.title | translate }}</h3><p>{{ step.body | translate }}</p></li> }</ol></div></section>
