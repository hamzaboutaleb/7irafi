<section class="py-16 bg-gray-50">
  <div class="max-w-7xl mx-auto px-8">
    <h2 class="text-3xl font-bold text-gray-900 text-center mb-10">How it works</h2>
    <div class="grid grid-cols-3 gap-8">
      @for (step of steps(); track step.number) {
        <div class="flex flex-col items-center text-center">
          <div class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl font-bold mb-4">
            {{ step.number }}
          </div>
          <h3 class="text-xl font-semibold text-gray-900 mb-2">{{ step.title }}</h3>
          <p class="text-gray-500">{{ step.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
