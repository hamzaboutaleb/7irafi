input {
  file {
    path           => "/var/lib/docker/containers/*/*-json.log"
    start_position => "beginning"
    sincedb_path   => "/usr/share/logstash/data/sincedb"
    # Keep Logstash's own fields flat (host, path) instead of the ECS v8 default
    # ([host][name], [log][file][path], [event][original]); the last of those
    # would clash with the application's own "event" field handled below. ECS
    # must be disabled on the codec too: it defaults to the pipeline's ECS v8
    # and is what adds [event][original] to lines that carry no app "event".
    codec          => json { ecs_compatibility => "disabled" }
    ecs_compatibility => "disabled"
  }
}

filter {
  # The application's own JSON line is inside the Docker "log" string.
  json {
    source               => "log"
    skip_on_invalid_json => true
    remove_field         => ["log"]
    ecs_compatibility    => "disabled"
  }

  # Index only 7irafi application logs. Our services set "service" to their
  # spring.application.name; anything else (Postgres, MinIO, Elasticsearch,
  # Kibana, Logstash or a stray container) is dropped. This also covers lines
  # with no "service" field or where "service" is an object (Kibana's ECS
  # service.name), which would otherwise cause a mapping conflict.
  if [service] not in ["auth-service", "user-service", "job-service", "application-service", "chat-service", "notification-service", "api-gateway", "discovery-service"] {
    drop { }
  }

  if ![environment] { mutate { add_field => { "environment" => "dev" } } }

  # Drop only what Docker and Logstash add themselves; keep the application's own
  # "event" field (login_failed, internal_call_failed) that T6.4 needs.
  mutate { remove_field => ["stream", "time", "path", "host"] }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "${LOGSTASH_ES_USER:logstash_writer}"
    password => "${LOGSTASH_ES_PASSWORD}"
    index    => "7irafi-logs-%{+YYYY.MM.dd}"
    # logstash_writer is least-privilege (no manage_index_templates). The ES
    # output otherwise tries to install its own default template at startup,
    # gets a 403 and the pipeline fails to bootstrap. es-setup already installs
    # the 7irafi-logs index template, so Logstash does not manage one.
    manage_template => false
  }
}
