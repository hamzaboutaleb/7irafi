global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8082']
  - job_name: job-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['job-service:8083']
  - job_name: application-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['application-service:8084']
  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chat-service:8085']
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8086']
  # Only the gateway port is public, so only it needs basic auth; entrypoint.sh writes these files.
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    basic_auth:
      username_file: /run/secrets/metrics_username
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['discovery-service:8761']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
