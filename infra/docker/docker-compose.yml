services:
  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - ./kafka/start.sh:/opt/kafka/start.sh:ro
      - ./kafka/init-topics.sh:/opt/kafka/init-topics.sh:ro
      - kafka-data:/var/lib/kafka/data
    entrypoint: ["/bin/sh", "/opt/kafka/start.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          topics=$$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null) &&
          printf '%s\n' "$$topics" | grep -Fxq analytics.events &&
          printf '%s\n' "$$topics" | grep -Fxq jobs.lifecycle &&
          printf '%s\n' "$$topics" | grep -Fxq notification.request &&
          printf '%s\n' "$$topics" | grep -Fxq users.registered
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    container_name: postgres-dev
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Automated Postgres backups. Dumps every service database on an interval and
  # prunes old dumps. Restore is manual, via infra/backup/restore.sh — see the
  # disaster recovery section of the README.
  db-backup:
    image: postgres:17-alpine
    container_name: db-backup
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ../backup:/scripts:ro
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ../../backend
      dockerfile: auth-service/Dockerfile
    environment:
      LOG_FORMAT: logstash
      JWT_ACCESS_TOKEN_TTL: 30m
      JWT_REFRESH_TOKEN_TTL: 7d
      SERVER_PORT: 8081
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SQL_LOG_LEVEL: info
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: 7irafi-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: ../../backend
      dockerfile: user-service/Dockerfile
    environment:
      LOG_FORMAT: logstash
      ONLINE_THRESHOLD: 2m
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      SERVER_PORT: 8082
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SQL_LOG_LEVEL: info
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      S3_BUCKET: avatars
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-service:
    build:
      context: ../../backend
      dockerfile: notification-service/Dockerfile
    environment:
      LOG_FORMAT: logstash
      JWT_ISSUER: 7irafi-auth-service
      ALLOWED_ORIGIN: http://localhost:4200
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      SERVER_PORT: 8086
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SQL_LOG_LEVEL: info
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8086/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  chat-service:
    build:
      context: ../../backend
      dockerfile: chat-service/Dockerfile
    environment:
      LOG_FORMAT: logstash
      JWT_ISSUER: 7irafi-auth-service
      ALLOWED_ORIGIN: http://localhost:4200
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      SERVER_PORT: 8085
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/chat_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SQL_LOG_LEVEL: info
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8085/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  job-service:
    container_name: job-service-dev
    build:
      context: ../../backend
      dockerfile: job-service/Dockerfile
    environment:
      LOG_FORMAT: logstash
      FRONTEND_ORIGIN: http://localhost:4200
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      SERVER_PORT: 8083
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/job_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SHOW_SQL: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      S3_BUCKET: jobs
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ../../backend/job-service/src:/app/src
      - job-maven-cache:/root/.m2
    # job-maven-cache hides the image's ~/.m2, so the shared-kernel jar installed
    # at build time is missing from a volume created before it. Installing it
    # again on start keeps the volume in step with the image.
    entrypoint: ["sh", "-c"]
    command:
      - mvn -q -f /shared-kernel/pom.xml -DskipTests install && exec mvn spring-boot:run
    develop:
      watch:
        - action: rebuild
          path: ../../backend/job-service/src
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      # auth-service:
      #   condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  application-service:
    build:
      context: ../../backend
      dockerfile: application-service/Dockerfile
    environment:
      LOG_FORMAT: logstash
      SERVER_PORT: 8084
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/application_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JOB_SERVICE_URL: http://job-service:8083
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8084/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  analytics-service:
    build:
      context: ../../backend/analytics-service
      dockerfile: Dockerfile
    environment:
      LOG_FORMAT: logstash
      SERVER_PORT: 8087
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: 7irafi-auth-service
      FRONTEND_ORIGIN: http://localhost:4200
    ports:
      - "127.0.0.1:8087:8087"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  rating-service:
    build:
      context: ../../backend/rating-service
      dockerfile: Dockerfile
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      LOG_FORMAT: logstash
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_HTTP_CONNECT_TIMEOUT: 1s
      SERVICE_HTTP_READ_TIMEOUT: 2s
      SERVER_PORT: 8087
      DB_URL: jdbc:postgresql://postgres:5432/rating_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SHOW_SQL: "true"
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8087/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    build:
      context: ./minio
      args:
        MINIO_RELEASE: RELEASE.2025-09-07T16-13-09Z
        MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/cluster || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    container_name: api-gateway-dev
    build:
      context: ../../backend
      dockerfile: api-gateway/Dockerfile
    environment:
      LOG_FORMAT: logstash
      SERVER_PORT: 8080
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: 7irafi-auth-service
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      FRONTEND_ORIGIN: http://localhost:4200
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      rating-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    container_name: frontend-dev
    image: frontend-dev:latest
    build:
      context: ../..
      dockerfile: infra/docker/frontend/dockerfiles/angular.dev.Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ../../frontend:/app
      - /app/node_modules

  discovery-service:
    container_name: discovery-service-dev
    build:
      context: ../../backend/discovery-service
      dockerfile: Dockerfile
    environment:
      LOG_FORMAT: logstash
      SERVER_PORT: 8761
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8761/actuator/health | grep -q UP",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8761:8761"

  prometheus:
    profiles: ["observability"]
    container_name: prometheus-dev
    image: prom/prometheus:v2.53.1
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.enable-lifecycle
    environment:
      METRICS_USERNAME: ${METRICS_USERNAME}
      METRICS_PASSWORD: ${METRICS_PASSWORD}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # In-memory dir for the scrape credentials; the image runs as nobody and
    # cannot create /run/secrets itself. mode=1777 keeps it writable after a
    # restart (without it the entrypoint fails with Permission denied).
    tmpfs:
      - /run/secrets:mode=1777
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    profiles: ["observability"]
    container_name: grafana-dev
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  node-exporter:
    profiles: ["observability"]
    container_name: node-exporter-dev
    image: prom/node-exporter:v1.8.2
    # No rslave, --path.rootfs or pid: host: Docker Desktop refuses rslave on / and
    # binds / to the WSL distro, not the Docker VM, so rootfs and pid: host made
    # node-exporter stat the wrong paths. Every mount is now read where it is.
    volumes:
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  alertmanager:
    profiles: ["observability"]
    container_name: alertmanager-dev
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    profiles: ["observability"]
    container_name: elasticsearch-dev
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 5s
      timeout: 5s
      retries: 30

  es-setup:
    profiles: ["observability"]
    container_name: es-setup
    image: curlimages/curl:8.9.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      LOGSTASH_ES_PASSWORD: ${LOGSTASH_ES_PASSWORD}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS}
    volumes:
      - ./elasticsearch:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup.sh"]
    restart: "no"

  logstash:
    profiles: ["observability"]
    container_name: logstash-dev
    image: docker.elastic.co/logstash/logstash:8.15.3
    # The image runs as uid 1000, but Docker's *-json.log files are root-owned
    # (0640), so Logstash runs as root to read the container logs it tails.
    user: "0"
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      LOGSTASH_ES_USER: ${LOGSTASH_ES_USER}
      LOGSTASH_ES_PASSWORD: ${LOGSTASH_ES_PASSWORD}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - logstash-data:/usr/share/logstash/data
    depends_on:
      es-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  kibana:
    profiles: ["observability"]
    container_name: kibana-dev
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      es-setup:
        condition: service_completed_successfully

  kibana-setup:
    profiles: ["observability"]
    container_name: kibana-setup
    image: curlimages/curl:8.9.1
    depends_on:
      kibana:
        condition: service_started
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./kibana:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup.sh"]
    restart: "no"

volumes:
  kafka-data:
  postgres-data:
  postgres-backups:
  job-maven-cache:
  minio_data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  logstash-data:
