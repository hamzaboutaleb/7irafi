services:
  postgres:
    container_name: postgres-dev
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME:-herafi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-herafi}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Automated Postgres backups. Dumps every service database on an interval and
  # prunes old dumps. Restore is manual, via infra/backup/restore.sh — see the
  # disaster recovery section of the README.
  db-backup:
    image: postgres:17-alpine
    container_name: db-backup
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-herafi}
      PGPASSWORD: ${DB_PASSWORD:-herafi}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ../backup:/scripts:ro
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-herafi}
      DB_PASSWORD: ${DB_PASSWORD:-herafi}
      SHOW_SQL: "true"
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-7irafi-development-internal-key}
      JWT_SECRET: ${JWT_SECRET:-7irafi-development-jwt-secret-change-me-2026}
      JWT_ISSUER: 7irafi-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: ../../backend/user-service
      dockerfile: Dockerfile
    environment:
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: ${DB_USERNAME:-herafi}
      DB_PASSWORD: ${DB_PASSWORD:-herafi}
      SHOW_SQL: "true"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-7irafi-development-gateway-key}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-7irafi-development-internal-key}
      S3_BUCKET: avatars
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 20

  notification-service:
    build:
      context: ../../backend/notification-service
      dockerfile: Dockerfile
    environment:
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      SERVER_PORT: 8086
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${DB_USERNAME:-herafi}
      DB_PASSWORD: ${DB_PASSWORD:-herafi}
      SHOW_SQL: "true"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-7irafi-development-gateway-key}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-7irafi-development-internal-key}
      JWT_SECRET: ${JWT_SECRET:-7irafi-development-jwt-secret-change-me-2026}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 20

  chat-service:
    build: 
      context: ../../backend/chat-service
      dockerfile: Dockerfile
    environment:
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/chat_db
      DB_USERNAME: ${DB_USERNAME:-herafi}
      DB_PASSWORD: ${DB_PASSWORD:-herafi}
      SHOW_SQL: "true"
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-7irafi-development-gateway-key}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-7irafi-development-internal-key}
      JWT_SECRET: ${JWT_SECRET:-7irafi-development-jwt-secret-change-me-2026}
    ports:
      - "8085:8085"
    depends_on:
      postgres: 
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 20


  job-service:
    container_name: job-service-dev
    build:
      context: ../../backend/job-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/job_db
      DB_USERNAME: ${DB_USERNAME:-herafi}
      DB_PASSWORD: ${DB_PASSWORD:-herafi}
      SHOW_SQL: "true"
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-7irafi-development-gateway-key}
      S3_BUCKET: jobs
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-7irafi-development-internal-key}
    ports:
      - "8083:8083"
    volumes:
      - ../../backend/job-service/src:/app/src
      - job-maven-cache:/root/.m2
    entrypoint: [ "mvn" ]
    command: [ "spring-boot:run" ]
    develop:
      watch:
        - action: rebuild
          path: ../../backend/job-service/src
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # auth-service:
      #   condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 20

  application-service:
    build:
      context: ../../backend/application-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/application_db
      DB_USERNAME: ${DB_USERNAME:-herafi}
      DB_PASSWORD: ${DB_PASSWORD:-herafi}
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-7irafi-development-gateway-key}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-7irafi-development-internal-key}
      JOB_SERVICE_URL: http://job-service:8083
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP" ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # image: local/minio-community:RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./minio
      args:
        PROJECT: minio
        RELEASE: RELEASE.2025-09-07T16-13-09Z
    entrypoint: [ "minio" ]
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/cluster || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # image: local/minio-client:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ./minio
      args:
        PROJECT: mc
        RELEASE: RELEASE.2025-08-13T08-35-41Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minio}' '${MINIO_ROOT_PASSWORD:-minio123}'
      && mc mb --ignore-existing local/jobs
      && mc mb --ignore-existing local/avatars
      && mc ilm rule add --tags 'cleanup=pending' --expire-days 1 local/jobs "

  api-gateway:
    container_name: api-gateway-dev
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      DISCOVERY_SERVICE_URL: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-7irafi-development-jwt-secret-change-me-2026}
      JWT_ISSUER: 7irafi-auth-service
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-7irafi-development-gateway-key}
      FRONTEND_ORIGIN: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  frontend:
    container_name: frontend-dev
    image: frontend-dev:latest
    build:
      context: ../..
      dockerfile: infra/docker/frontend/dockerfiles/angular.dev.Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ../../frontend:/app
      - /app/node_modules

  discovery-service:
    container_name: discovery-service-dev
    build:
      context: ../../backend/discovery-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8761
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8761:8761"

volumes:
  postgres-data:
  postgres-backups:
  job-maven-cache:
  minio_data:
